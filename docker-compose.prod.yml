version: '3.8'

services:
  # Database Service (PostgreSQL 16 Alpine)
  db:
    image: postgres:16-alpine
    container_name: jkspdc_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jkspdc}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - jkspdc_network

  # Object Storage Service (MinIO S3 Emulator)
  s3:
    image: minio/minio
    container_name: jkspdc_prod_s3
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    command: server /data
    networks:
      - jkspdc_network

  # Backend REST API Service (NestJS Production Container)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jkspdc_prod_backend
    restart: unless-stopped
    volumes:
      - uploads_data:/usr/src/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jkspdc}?schema=public
      - S3_ENDPOINT=http://s3:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-jkspdc-assets}
      - S3_FORCE_PATH_STYLE=true
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
    depends_on:
      - db
      - s3
    networks:
      - jkspdc_network

  # Frontend Citizen Portal Service (Astro SSR Production Container)
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: jkspdc_prod_website
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - BACKEND_URL=http://backend:3000
      - PUBLIC_API_BASE=
    depends_on:
      - backend
    networks:
      - jkspdc_network

  # Secure Reverse Proxy (Nginx)
  web-proxy:
    image: nginx:alpine
    container_name: jkspdc_prod_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - website
      - backend
      - s3
    networks:
      - jkspdc_network

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
  uploads_data:
    driver: local

networks:
  jkspdc_network:
    driver: bridge

