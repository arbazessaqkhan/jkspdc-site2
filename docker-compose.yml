version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: jkspdc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jkspdc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - jkspdc_network

  # Object Storage Service (MinIO - S3 Emulator)
  s3:
    image: minio/minio
    container_name: jkspdc_s3
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin_user
      MINIO_ROOT_PASSWORD: minio_admin_password
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    networks:
      - jkspdc_network

  # Backend REST API Service (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: jkspdc_backend
    restart: unless-stopped
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@db:5432/jkspdc?schema=public
      - S3_ENDPOINT=http://s3:9000
      - S3_ACCESS_KEY=minio_admin_user
      - S3_SECRET_KEY=minio_admin_password
      - S3_BUCKET_NAME=jkspdc-assets
      - S3_FORCE_PATH_STYLE=true
      - JWT_SECRET=dev_secret_only_for_local_debugging_38dfjksd
      - SESSION_SECRET=dev_session_secret_only_for_local_debugging_dfj2k3
      - CORS_ORIGIN=http://localhost,http://localhost:3000,http://localhost:4321
    depends_on:
      - db
      - s3
    networks:
      - jkspdc_network

  # Frontend Citizen Portal Service (Astro)
  website:
    build:
      context: ./website
      dockerfile: Dockerfile.dev
    container_name: jkspdc_website
    restart: unless-stopped
    volumes:
      - ./website:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - jkspdc_network

  # Secure Reverse Proxy (Nginx)
  web-proxy:
    image: nginx:alpine
    container_name: jkspdc_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - website
      - backend
      - s3
    networks:
      - jkspdc_network

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local

networks:
  jkspdc_network:
    driver: bridge
