services:
  - type: web
    name: jkspdc-portal
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: BACKEND_URL
        value: http://127.0.0.1:3000
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
